# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout sensor-watch-ir-sender
        uses: actions/checkout@v4
        with:
          repository: rjeschmi/sensor-watch-ir-sender
          path: sensor-watch-ir-sender
      - name: Checkout second-movement
        uses: actions/checkout@v4
        with:
          repository: rjeschmi/second-movement
          ref: set-time-with-ir
          path: second-movement
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Copy sensor-watch-ir-sender
        run: |
          mkdir -p dist/sensor-watch-ir-sender
          cp sensor-watch-ir-sender/{index.html,app.js,protocol.js,style.css} dist/sensor-watch-ir-sender/
      - name: Copy simulator
        run: |
          mkdir -p dist/simulator
          cp second-movement/build-sim/{firmware.html,firmware.js,firmware.wasm} dist/simulator/
      - name: Inject nav bar into static pages
        run: |
          python3 - <<'EOF'
          import re

          NAV = '''<nav style="position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);padding:8px 16px;font-family:sans-serif;font-size:13px;display:flex;gap:20px;align-items:center;">
            <a href="/" style="color:#ccc;text-decoration:none;">⌂ Home</a>
            <a href="/sensor-watch-ir-sender/" style="color:#ccc;text-decoration:none;">IR Sender</a>
            <a href="/simulator/firmware.html" style="color:#ccc;text-decoration:none;">Simulator</a>
          </nav><div style="height:36px"></div>'''

          for path in ['dist/sensor-watch-ir-sender/index.html', 'dist/simulator/firmware.html']:
              with open(path, 'r') as f:
                  html = f.read()
              html = re.sub(r'(<body[^>]*>)', r'\1' + NAV, html, count=1)
              with open(path, 'w') as f:
                  f.write(html)
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
